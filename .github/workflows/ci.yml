name: CI

on:
  push:
    branches: [main, owen]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests + region/perf gates
        run: npm test

      - name: Production build (includes Clinic JS budget gate)
        run: npm run build
        env:
          # NEXT_PUBLIC_* is baked in at build time — mirror netlify.toml's
          # [build.environment] flags so the Clinic JS budget gate measures
          # the same first-load graph CI checks and Netlify actually ships
          # (KAZI-588 was burned by these diverging).
          NEXT_PUBLIC_SPACES_ENABLED: 'true'
          NEXT_PUBLIC_IRP_PROFILE_ENABLED: 'true'
          NEXT_PUBLIC_EPP_PROFILE_ENABLED: 'true'
          NEXT_PUBLIC_WORKSPACE_ASSET_RAIL_V2: 'true'
