# KAZI-567 rum_ingest — included by deploy/public-edge/nginx.conf
# Numbers must match src/lib/perf/rum-ingest-policy.json (CI asserts).
#   max_body_bytes=2048  rate=30/60s  burst=10  POST /api/rum only

limit_req_zone $binary_remote_addr zone=rum_ingest:10m rate=30r/m;

location = /api/rum {
    if ($request_method != POST) {
        return 405;
    }
    client_max_body_size 2k;
    limit_req zone=rum_ingest burst=10 nodelay;
    limit_req_status 429;

    # Trusted proxy boundary: drop client-controlled identity headers
    # and inject the only key the app will read (x-rum-client-ip).
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Rum-Client-Ip $remote_addr;

    proxy_pass http://127.0.0.1:3000;
}
