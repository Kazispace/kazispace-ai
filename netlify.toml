# KAZI-567 rum_ingest (src/lib/perf/rum-ingest-policy.json):
# POST /api/rum — 30 req / 60s / IP, max body 2048 bytes, same-origin.
# App route fail-closes (Content-Length + capped read + token bucket).
# CN public-edge: include deploy/rum-ingest.nginx.conf

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-optional"
  NEXT_PUBLIC_IRP_PROFILE_ENABLED = "true"
  NEXT_PUBLIC_EPP_PROFILE_ENABLED = "true"
  NEXT_PUBLIC_SPACES_ENABLED = "true"
  NEXT_PUBLIC_WORKSPACE_ASSET_RAIL_V2 = "true"

