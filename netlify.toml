# KaziSpace — Netlify Configuration

[build]
  publish = "."

# Clean URL: /chat → /chat.html
[[redirects]]
  from = "/chat"
  to   = "/chat.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
