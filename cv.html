<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV Builder — KaziSpace</title>
  <meta name="description" content="Build a professional, ATS-optimized CV in minutes with KaziSpace AI." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange:   #F47920;
      --orange-d: #d96a10;
      --navy:     #0D1B2A;
      --navy2:    #132237;
      --blue:     #1a56db;
      --blue-d:   #1447c0;
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #1c2128;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --success:  #3fb950;
      --danger:   #f85149;
      --radius:   12px;
      --font:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    html, body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

    /* ── NAV ── */
    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; height: 52px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .nav-logo { font-weight: 700; font-size: 1.1rem; color: var(--text); text-decoration: none; }
    .nav-logo em { color: var(--orange); font-style: normal; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-link { color: var(--muted); text-decoration: none; font-size: 0.85rem; transition: color .2s; }
    .nav-link:hover { color: var(--text); }
    .credits-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; color: var(--muted); display: none; }
    .credits-badge span { color: var(--success); font-weight: 600; }

    /* ── LOGIN BANNER ── */
    #login-banner { background: linear-gradient(90deg,rgba(244,121,32,.12),transparent); border-bottom: 1px solid var(--border); padding: 10px 20px; display: none; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
    #login-banner p { font-size: 0.85rem; color: var(--muted); }
    #login-banner p strong { color: var(--text); }
    .btn-tg-login { background: #229ED9; color: #fff; border: none; border-radius: 8px; padding: 7px 16px; font-size: 0.82rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .btn-tg-login:hover { background: #1a8fc4; }

    /* ── MAIN LAYOUT ── */
    .main { flex: 1; display: flex; overflow: hidden; }

    /* ── CHAT PANEL ── */
    .chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
    .chat-header-left h2 { font-size: 1rem; font-weight: 600; }
    .chat-header-left .subtitle { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .btn-new-cv { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 5px 12px; font-size: 0.8rem; cursor: pointer; transition: all .2s; }
    .btn-new-cv:hover { border-color: var(--orange); color: var(--orange); }

    /* ── MESSAGES ── */
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── BUBBLES ── */
    .bubble-row { display: flex; gap: 10px; max-width: 680px; }
    .bubble-row.user { flex-direction: row-reverse; align-self: flex-end; }
    .bubble-row.bot  { align-self: flex-start; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    .avatar.bot-av  { background: linear-gradient(135deg,var(--orange),#c0392b); }
    .avatar.user-av { background: var(--surface2); border: 1px solid var(--border); }
    .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; font-size: 0.9rem; line-height: 1.6; max-width: 540px; }
    .bubble-row.user .bubble { background: var(--blue); border-color: var(--blue); color: #fff; border-radius: var(--radius) var(--radius) 4px var(--radius); }
    .bubble-row.bot  .bubble { border-radius: 4px var(--radius) var(--radius) var(--radius); }
    .bubble h1,.bubble h2,.bubble h3 { margin: 8px 0 4px; }
    .bubble h1 { font-size: 1.05rem; }
    .bubble h2 { font-size: 0.9rem; color: #60a5fa; border-bottom: 1px solid var(--border); padding-bottom: 3px; }
    .bubble h3 { font-size: 0.85rem; }
    .bubble ul { padding-left: 16px; margin: 4px 0; }
    .bubble li { margin-bottom: 2px; }
    .bubble p { margin-bottom: 5px; }
    .bubble strong { font-weight: 600; }

    /* ── CHIPS ── */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 20px; padding: 6px 14px; font-size: 0.82rem; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .chip:hover { border-color: var(--orange); color: var(--orange); }
    .chip.selected { background: var(--orange); border-color: var(--orange); color: #fff; }
    .chip.disabled { opacity: .4; pointer-events: none; }

    /* ── TYPING INDICATOR ── */
    .typing-row { display: flex; gap: 10px; align-self: flex-start; }
    .typing-bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 4px var(--radius) var(--radius) var(--radius); padding: 12px 16px; display: flex; gap: 5px; align-items: center; }
    .typing-dot { width: 7px; height: 7px; background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

    /* ── INPUT BAR ── */
    .input-bar { padding: 12px 20px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; display: flex; gap: 10px; align-items: flex-end; }
    #msg-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 0.9rem; resize: none; max-height: 120px; font-family: var(--font); line-height: 1.5; }
    #msg-input:focus { outline: none; border-color: var(--orange); }
    #msg-input::placeholder { color: var(--muted); }
    #msg-input:disabled { opacity: .5; cursor: not-allowed; }
    #send-btn { background: var(--orange); border: none; color: #fff; border-radius: 10px; width: 42px; height: 42px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .2s; }
    #send-btn:hover { background: var(--orange-d); }
    #send-btn:disabled { opacity: .4; pointer-events: none; }

    /* ── PREVIEW PANEL ── */
    .preview-panel { width: 420px; border-left: 1px solid var(--border); display: flex; flex-direction: column; background: var(--surface); flex-shrink: 0; }
    @media (max-width: 900px) { .preview-panel { display: none; } }
    .preview-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .preview-header h3 { font-size: 0.9rem; font-weight: 600; }
    .preview-actions { display: flex; gap: 8px; }
    .btn-sm { border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 8px; padding: 5px 12px; font-size: 0.8rem; cursor: pointer; transition: all .2s; white-space: nowrap; }
    .btn-sm:hover { border-color: var(--orange); color: var(--orange); }
    .btn-sm.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
    .btn-sm.primary:hover { background: var(--orange-d); }
    .btn-sm:disabled { opacity: .4; pointer-events: none; }
    .preview-body { flex: 1; overflow-y: auto; padding: 20px; }
    .preview-body::-webkit-scrollbar { width: 4px; }
    .preview-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .preview-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--muted); text-align: center; }
    .preview-placeholder .icon { font-size: 3rem; opacity: .4; }
    .preview-placeholder p { font-size: 0.85rem; max-width: 220px; line-height: 1.5; }
    #cv-preview-content h1 { font-size: 1.15rem; margin-bottom: 4px; }
    #cv-preview-content h2 { font-size: 0.82rem; color: var(--orange); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); padding-bottom: 3px; margin: 14px 0 6px; }
    #cv-preview-content h3 { font-size: 0.85rem; font-weight: 600; margin: 8px 0 2px; }
    #cv-preview-content ul { padding-left: 16px; margin-bottom: 6px; }
    #cv-preview-content li { margin-bottom: 2px; font-size: 0.83rem; }
    #cv-preview-content p { font-size: 0.83rem; margin-bottom: 4px; }
    #cv-preview-content strong { font-weight: 600; }

    /* ── EDIT PANEL ── */
    #edit-panel { border-top: 1px solid var(--border); padding: 12px 16px; display: none; flex-direction: column; gap: 8px; }
    #edit-panel.visible { display: flex; }
    #edit-input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; resize: none; height: 64px; width: 100%; font-family: var(--font); }
    #edit-input:focus { outline: none; border-color: var(--orange); }
    .edit-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* ── TOAST ── */
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 20px; font-size: 0.85rem; color: var(--text); transition: transform .3s ease; z-index: 999; pointer-events: none; white-space: nowrap; }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.error { border-color: var(--danger); color: var(--danger); }
    #toast.success { border-color: var(--success); color: var(--success); }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="index.html">Kazi<em>Space</em></a>
  <div class="nav-right">
    <a class="nav-link" href="chat.html">💬 Chat</a>
    <a class="nav-link" href="cv.html" style="color:var(--text);">📄 CV Builder</a>
    <div class="credits-badge" id="credits-display">Credits: <span id="credits-val">—</span></div>
  </div>
</nav>

<!-- LOGIN BANNER -->
<div id="login-banner">
  <p><strong>Sign in with Telegram</strong> to save your CV and access it from any device.</p>
  <button class="btn-tg-login" onclick="loginWithTelegram()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.833.941z"/></svg>
    Login with Telegram
  </button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- CHAT PANEL -->
  <div class="chat-panel">
    <div class="chat-header">
      <div class="chat-header-left">
        <h2>📄 CV Builder</h2>
        <div class="subtitle">Chat-first · AI-powered · ATS-optimized</div>
      </div>
      <button class="btn-new-cv" onclick="startNewCV()">+ New CV</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-bar">
      <textarea id="msg-input" placeholder="Type your answer here..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <!-- PREVIEW PANEL -->
  <div class="preview-panel">
    <div class="preview-header">
      <h3>CV Preview</h3>
      <div class="preview-actions">
        <button class="btn-sm" id="btn-edit-cv" onclick="toggleEditPanel()" disabled>✏️ Edit</button>
        <button class="btn-sm primary" id="btn-pdf" onclick="exportPDF()" disabled>📥 PDF</button>
      </div>
    </div>
    <div class="preview-body">
      <div class="preview-placeholder" id="preview-placeholder">
        <div class="icon">📄</div>
        <p>Your CV will appear here once generated.</p>
      </div>
      <div id="cv-preview-content" style="display:none;"></div>
    </div>
    <div id="edit-panel">
      <textarea id="edit-input" placeholder="e.g. Make the summary shorter, add more technical skills..."></textarea>
      <div class="edit-actions">
        <button class="btn-sm" onclick="toggleEditPanel()">Cancel</button>
        <button class="btn-sm primary" onclick="submitEdit()">Apply Edit</button>
      </div>
    </div>
  </div>

</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// =================================================================
// Config & State
// =================================================================
const API = 'https://bot.kazispace.ai';
let userId    = localStorage.getItem('kazi_user_id');
let authToken = localStorage.getItem('kazi_auth_token');
let cvState   = 'idle';
let currentDocId = null;
let regenerateRemaining = 2;
let inputLocked = false;

// =================================================================
// Init
// =================================================================
document.addEventListener('DOMContentLoaded', () => {
  if (!userId) {
    userId = 'web_' + Math.random().toString(36).slice(2, 11);
    localStorage.setItem('kazi_user_id', userId);
  }
  checkLoginState();
  updateCreditsDisplay();
  startNewCV();
});

function checkLoginState() {
  if (!authToken) {
    document.getElementById('login-banner').style.display = 'flex';
  } else {
    document.getElementById('login-banner').style.display = 'none';
  }
}

async function updateCreditsDisplay() {
  if (!authToken) return;
  try {
    const r = await fetch(`${API}/api/v1/me`, { headers: { Authorization: `Bearer ${authToken}` } });
    if (r.ok) {
      const d = await r.json();
      document.getElementById('credits-display').style.display = 'block';
      document.getElementById('credits-val').textContent = d.credits_left ?? '—';
    }
  } catch {}
}

// =================================================================
// Session Management
// =================================================================
async function startNewCV() {
  clearMessages();
  cvState = 'idle';
  currentDocId = null;
  regenerateRemaining = 2;
  inputLocked = false;
  resetPreview();
  document.getElementById('btn-edit-cv').disabled = true;
  document.getElementById('btn-pdf').disabled = true;
  setInputEnabled(false, 'Please select an option above...');

  const resp = await callCV({ action: 'reset' });
  if (resp) handleCVResponse(resp);
}

async function callCV(body) {
  try {
    const headers = { 'Content-Type': 'application/json' };
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    else headers['X-User-Id'] = userId;

    const r = await fetch(`${API}/api/v1/cv/chat`, {
      method: 'POST',
      headers,
      body: JSON.stringify({ ...body, session_key: `cv_web_${userId}` }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      showToast(err.detail || 'Request failed', 'error');
      return null;
    }
    return await r.json();
  } catch {
    showToast('Network error. Please try again.', 'error');
    return null;
  }
}

// =================================================================
// Message Rendering
// =================================================================
function clearMessages() {
  document.getElementById('messages').innerHTML = '';
}

function addBotMessage(text, chips = [], chipAction = null) {
  const row = document.createElement('div');
  row.className = 'bubble-row bot';
  const html = typeof marked !== 'undefined'
    ? marked.parse(text)
    : text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  let chipsHtml = '';
  if (chips.length) {
    const id = 'chips_' + Date.now();
    chipsHtml = `<div class="chips" id="${id}">` +
      chips.map(c =>
        `<button class="chip" data-action="${chipAction}" data-value="${escHtml(c)}" onclick="selectChip(this)">${escHtml(c)}</button>`
      ).join('') + `</div>`;
  }
  row.innerHTML = `
    <div class="avatar bot-av">🤖</div>
    <div class="bubble">${html}${chipsHtml}</div>`;
  document.getElementById('messages').appendChild(row);
  scrollToBottom();
}

function addUserMessage(text) {
  const row = document.createElement('div');
  row.className = 'bubble-row user';
  row.innerHTML = `
    <div class="avatar user-av">👤</div>
    <div class="bubble">${escHtml(text)}</div>`;
  document.getElementById('messages').appendChild(row);
  scrollToBottom();
}

function showTyping() {
  removeTyping();
  const row = document.createElement('div');
  row.className = 'typing-row';
  row.id = 'typing-indicator';
  row.innerHTML = `
    <div class="avatar bot-av">🤖</div>
    <div class="typing-bubble">
      <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
    </div>`;
  document.getElementById('messages').appendChild(row);
  scrollToBottom();
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function disableAllChips() {
  document.querySelectorAll('.chip:not(.selected)').forEach(c => c.classList.add('disabled'));
}

// =================================================================
// Chip Selection
// =================================================================
async function selectChip(btn) {
  if (inputLocked) return;
  const action = btn.dataset.action;
  const value  = btn.dataset.value;

  // Post-generate actions handled locally
  if (action === 'post_generate') {
    disableAllChips();
    btn.classList.add('selected');
    if (value.startsWith('🔄 Regenerate')) {
      await doRegenerate();
    } else if (value === '✏️ Edit CV') {
      toggleEditPanel();
    } else if (value === '🆕 Start New CV') {
      startNewCV();
    }
    return;
  }

  disableAllChips();
  btn.classList.add('selected');
  addUserMessage(value);
  inputLocked = true;
  setInputEnabled(false, 'Please wait...');
  showTyping();

  const resp = await callCV({ action, value });
  removeTyping();
  inputLocked = false;
  if (resp) handleCVResponse(resp);
}

// =================================================================
// Free Text Input
// =================================================================
function sendMessage() {
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text || inputLocked || input.disabled) return;
  input.value = '';
  autoResize(input);
  addUserMessage(text);
  disableAllChips();
  inputLocked = true;
  setInputEnabled(false, 'Please wait...');
  showTyping();

  callCV({ message: text }).then(resp => {
    removeTyping();
    inputLocked = false;
    if (resp) handleCVResponse(resp);
  });
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// =================================================================
// Handle CV API Response
// =================================================================
function handleCVResponse(resp) {
  cvState = resp.state;

  if (resp.state === 'generated') {
    currentDocId = resp.doc_id;
    regenerateRemaining = resp.regenerate_remaining ?? 2;
    if (resp.cv_content) showCVPreview(resp.cv_content);
    addBotMessage(resp.message || '✅ Your CV is ready! Check the preview on the right.');

    // Post-generate action chips
    const actionChips = [];
    if (regenerateRemaining > 0) actionChips.push(`🔄 Regenerate (${regenerateRemaining} left)`);
    actionChips.push('✏️ Edit CV');
    actionChips.push('🆕 Start New CV');
    addBotMessage('What would you like to do next?', actionChips, 'post_generate');

    document.getElementById('btn-edit-cv').disabled = false;
    document.getElementById('btn-pdf').disabled = false;
    setInputEnabled(false, 'Use the buttons above or edit in the preview panel');
    updateCreditsDisplay();
    return;
  }

  if (resp.state === 'paywall') {
    addBotMessage(resp.message || '⚠️ You have used all your free CV credits. Please top up to continue.');
    setInputEnabled(false, 'Credits required');
    return;
  }

  const chips      = resp.buttons || [];
  const chipAction = resp.button_action || null;
  addBotMessage(resp.message || '', chips, chipAction);

  // If chips are present and it's not a confirm_or_more action, lock free text
  if (chips.length && chipAction !== 'confirm_or_more') {
    setInputEnabled(false, 'Please select an option above');
  } else {
    setInputEnabled(true, 'Type your answer here...');
  }
}

// =================================================================
// Regenerate
// =================================================================
async function doRegenerate() {
  inputLocked = true;
  setInputEnabled(false, 'Regenerating...');
  showTyping();
  const resp = await callCV({ action: 'regenerate' });
  removeTyping();
  inputLocked = false;
  if (!resp) { setInputEnabled(false, 'Error. Please try again.'); return; }

  if (resp.cv_content) showCVPreview(resp.cv_content);
  regenerateRemaining = resp.regenerate_remaining ?? 0;
  addBotMessage(resp.message || '🔄 New version generated!');

  const actionChips = [];
  if (regenerateRemaining > 0) actionChips.push(`🔄 Regenerate (${regenerateRemaining} left)`);
  actionChips.push('✏️ Edit CV');
  actionChips.push('🆕 Start New CV');
  addBotMessage('What would you like to do next?', actionChips, 'post_generate');
  setInputEnabled(false, 'Use the buttons above');
}

// =================================================================
// CV Preview
// =================================================================
function showCVPreview(markdown) {
  document.getElementById('preview-placeholder').style.display = 'none';
  const el = document.getElementById('cv-preview-content');
  el.style.display = 'block';
  el.innerHTML = typeof marked !== 'undefined' ? marked.parse(markdown) : markdown.replace(/\n/g, '<br>');
}

function resetPreview() {
  document.getElementById('preview-placeholder').style.display = 'flex';
  const el = document.getElementById('cv-preview-content');
  el.style.display = 'none';
  el.innerHTML = '';
  document.getElementById('edit-panel').classList.remove('visible');
}

// =================================================================
// Edit CV
// =================================================================
function toggleEditPanel() {
  const panel = document.getElementById('edit-panel');
  panel.classList.toggle('visible');
  if (panel.classList.contains('visible')) document.getElementById('edit-input').focus();
}

async function submitEdit() {
  const instruction = document.getElementById('edit-input').value.trim();
  if (!instruction || !currentDocId) return;
  document.getElementById('edit-input').value = '';
  toggleEditPanel();
  addUserMessage(`✏️ Edit: ${instruction}`);
  showTyping();

  try {
    const headers = { 'Content-Type': 'application/json' };
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    else headers['X-User-Id'] = userId;

    const r = await fetch(`${API}/api/v1/cv/${currentDocId}`, {
      method: 'PUT',
      headers,
      body: JSON.stringify({ edit_instruction: instruction }),
    });
    removeTyping();
    if (!r.ok) { showToast('Edit failed. Please try again.', 'error'); return; }
    const d = await r.json();
    if (d.content) showCVPreview(d.content);
    addBotMessage(`✅ CV updated (v${d.version}). Check the preview!`);
  } catch {
    removeTyping();
    showToast('Network error.', 'error');
  }
}

// =================================================================
// PDF Export
// =================================================================
async function exportPDF() {
  if (!currentDocId) return;
  const btn = document.getElementById('btn-pdf');
  btn.disabled = true;
  btn.textContent = '⏳ Generating...';
  showToast('Generating PDF...');

  try {
    const headers = {};
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    else headers['X-User-Id'] = userId;

    const r = await fetch(`${API}/api/v1/cv/${currentDocId}/export`, { method: 'POST', headers });
    if (!r.ok) { showToast('PDF export failed.', 'error'); return; }
    const blob = await r.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = `KaziSpace_CV_${currentDocId}.pdf`; a.click();
    URL.revokeObjectURL(url);
    showToast('PDF downloaded!', 'success');
  } catch {
    showToast('Network error.', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '📥 PDF';
  }
}

// =================================================================
// Telegram Login
// =================================================================
async function loginWithTelegram() {
  try {
    const r = await fetch(`${API}/api/v1/auth/telegram/init`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ web_user_id: userId }),
    });
    if (!r.ok) { showToast('Login init failed.', 'error'); return; }
    const { token, deep_link } = await r.json();
    window.open(deep_link, '_blank');
    showToast('Opened Telegram. Please confirm login there.');
    pollLogin(token);
  } catch { showToast('Network error.', 'error'); }
}

async function pollLogin(token) {
  for (let i = 0; i < 60; i++) {
    await new Promise(r => setTimeout(r, 3000));
    try {
      const r = await fetch(`${API}/api/v1/auth/telegram/poll/${token}`);
      if (!r.ok) break;
      const d = await r.json();
      if (d.status === 'ok') {
        authToken = d.user_id;
        localStorage.setItem('kazi_auth_token', authToken);
        localStorage.setItem('kazi_user_id', d.user_id);
        userId = d.user_id;
        document.getElementById('login-banner').style.display = 'none';
        document.getElementById('credits-display').style.display = 'block';
        document.getElementById('credits-val').textContent = d.credits_left ?? '—';
        showToast(`Welcome, ${d.display_name}! 🎉`, 'success');
        break;
      }
    } catch { break; }
  }
}

// =================================================================
// Utilities
// =================================================================
function setInputEnabled(enabled, placeholder) {
  const inp = document.getElementById('msg-input');
  const btn = document.getElementById('send-btn');
  inp.disabled = !enabled;
  btn.disabled = !enabled;
  if (placeholder) inp.placeholder = placeholder;
}

function scrollToBottom() {
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function escHtml(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type ? `show ${type}` : 'show';
  setTimeout(() => { t.className = type || ''; }, 3000);
}
</script>
